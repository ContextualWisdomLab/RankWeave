name: Apply governed release documentation once

on:
  push:
    branches: [release/governed-0.18.0-publication]
    paths:
      - .github/workflows/apply-governed-release-docs.yml

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/governed-0.18.0-publication
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply reviewed documentation changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path(
              ".github/scripts/apply_governed_release_docs.py"
          )
          script = script_path.read_text(encoding="utf-8")
          old = (
              'insert_before("CHANGELOG.md", "### Validation\\n", '
              'CHANGELOG_RELEASE)'
          )
          new = (
              'insert_before(\n'
              '    "CHANGELOG.md",\n'
              '    "### Validation\\n- Weighted-RRF folds require unique '
              'hashable item IDs, complete channel weights,\\n",\n'
              '    CHANGELOG_RELEASE,\n'
              ')'
          )
          if script.count(old) != 1:
              raise SystemExit("expected one CHANGELOG updater call")
          script_path.write_text(
              script.replace(old, new, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/test_create_release_workflow.py")
          tests = test_path.read_text(encoding="utf-8")
          replacements = (
              (
                  'assert "needs: release" in dispatch_block',
                  'assert "needs: [verify, release]" in dispatch_block',
              ),
              (
                  'assert "release authorization" in architecture',
                  'assert "release authorization" in architecture.lower()',
              ),
          )
          for old_test, new_test in replacements:
              if tests.count(old_test) != 1:
                  raise SystemExit(
                      f"expected one contract assertion: {old_test}"
                  )
              tests = tests.replace(old_test, new_test, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
          python .github/scripts/apply_governed_release_docs.py
          rm .github/scripts/apply_governed_release_docs.py
          rm .github/workflows/apply-governed-release-docs.yml
      - name: Verify focused release contracts
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m pytest \
            tests/test_create_release_workflow.py \
            tests/test_publish_workflow.py \
            tests/test_version.py -q
      - name: Commit verified durable changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "docs: synchronize governed release controls"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/release/governed-0.18.0-publication"
