name: Fix PR 33 agent layout documentation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  fix:
    if: >-
      github.event.pull_request.number == 33 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/auditable-rrf-cross-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/auditable-rrf-cross-validation
          fetch-depth: 0
          persist-credentials: false
      - name: Remove duplicated module-map entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          content = path.read_text(encoding="utf-8")
          duplicate = (
              "- `src/rankweave/cross_validation.py` — blocked convex and "
              "weighted-RRF policy assessment.\n"
          )
          if content.count(duplicate) != 1:
              raise SystemExit("expected exactly one redundant module-map line")
          path.write_text(content.replace(duplicate, "", 1), encoding="utf-8")
          PY
      - name: Commit focused documentation correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git -c core.hooksPath=/dev/null commit \
            -m "docs: deduplicate cross-validation module map"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/auditable-rrf-cross-validation"
