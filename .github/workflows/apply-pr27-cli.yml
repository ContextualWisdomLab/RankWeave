name: Apply PR 27 verification CLI

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-27-cli
  cancel-in-progress: true

jobs:
  implement-and-verify:
    if: >-
      github.event.pull_request.number == 27 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/verify-report-artifacts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/verify-report-artifacts
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Implement CLI, public API, and release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {path_text}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cli_path = Path("src/rankweave/cli.py")
          cli_text = cli_path.read_text(encoding="utf-8")

          import_anchor = "from rankweave.comparison import (\n"
          artifact_import = '''from rankweave.artifact_verification import (
              ArtifactVerificationReport,
              verify_report_artifacts,
          )
          '''
          if artifact_import.strip() not in cli_text:
              cli_text = cli_text.replace(
                  import_anchor,
                  artifact_import + import_anchor,
                  1,
              )

          constant_anchor = (
              'FAMILY_OUTPUT_SCHEMA_VERSION_V2 = '
              '"rankweave.trec-family-comparison.v2"\n'
          )
          verification_constant = (
              constant_anchor
              + 'VERIFICATION_OUTPUT_SCHEMA_VERSION = '
              '"rankweave.artifact-verification.v1"\n'
          )
          cli_text = cli_text.replace(
              constant_anchor,
              verification_constant,
              1,
          )

          parser_anchor = '''    schema_parser = subcommands.add_parser(
              "schema",
              help="emit one packaged JSON Schema report contract",
          )
          '''
          verification_parser = '''    verification_parser = subcommands.add_parser(
              "verify-artifacts",
              help="verify local artifacts against one persisted v2 report",
          )
          verification_parser.add_argument("--report", required=True)
          verification_parser.add_argument("--baseline-run", required=True)
          verification_parser.add_argument("--qrels", required=True)
          verification_parser.add_argument("--candidate-run")
          verification_parser.add_argument(
              "--candidate",
              dest="candidate_specs",
              action="append",
              metavar="ID=PATH",
          )
          verification_parser.add_argument(
              "--max-input-bytes",
              type=_positive_integer_parser("max-input-bytes"),
              default=DEFAULT_MAX_INPUT_BYTES,
          )
          verification_parser.add_argument(
              "--pretty",
              action="store_true",
              help="indent JSON output with two spaces",
          )

          '''
          if "verify-artifacts" not in cli_text:
              cli_text = cli_text.replace(
                  parser_anchor,
                  verification_parser + parser_anchor,
                  1,
              )

          old_reader = '''def _read_text_artifact_bounded(
              path: str | Path,
              max_input_bytes: int,
          ) -> _BoundedTextArtifact:
              """Read, hash, count, and strictly decode one bounded local artifact."""
              file_path = Path(path)
              pre_read_size = file_path.stat().st_size
              if pre_read_size > max_input_bytes:
                  raise ValueError(
                      f"{file_path}: exceeds max-input-bytes {max_input_bytes}"
                  )
              try:
                  with file_path.open("rb") as input_file:
                      raw_bytes = input_file.read(max_input_bytes + 1)
              except OverflowError as exc:
                  raise ValueError("max_input_bytes is too large for this platform") from exc
              if len(raw_bytes) > max_input_bytes:
                  raise ValueError(
                      f"{file_path}: exceeds max-input-bytes {max_input_bytes}"
                  )
              try:
                  decoded_text = raw_bytes.decode("utf-8", errors="strict")
              except UnicodeDecodeError as exc:
                  raise ValueError(f"{file_path}: must be valid UTF-8") from exc
              return _BoundedTextArtifact(
                  text=decoded_text,
                  sha256=hashlib.sha256(raw_bytes).hexdigest(),
                  byte_count=len(raw_bytes),
              )
          '''
          new_reader = '''def _read_bytes_bounded(
              path: str | Path,
              max_input_bytes: int,
          ) -> bytes:
              """Read one local file within the pre-read and actual byte ceiling."""
              file_path = Path(path)
              pre_read_size = file_path.stat().st_size
              if pre_read_size > max_input_bytes:
                  raise ValueError(
                      f"{file_path}: exceeds max-input-bytes {max_input_bytes}"
                  )
              try:
                  with file_path.open("rb") as input_file:
                      raw_bytes = input_file.read(max_input_bytes + 1)
              except OverflowError as exc:
                  raise ValueError(
                      "max_input_bytes is too large for this platform"
                  ) from exc
              if len(raw_bytes) > max_input_bytes:
                  raise ValueError(
                      f"{file_path}: exceeds max-input-bytes {max_input_bytes}"
                  )
              return raw_bytes


          def _read_text_artifact_bounded(
              path: str | Path,
              max_input_bytes: int,
          ) -> _BoundedTextArtifact:
              """Read, hash, count, and strictly decode one bounded local artifact."""
              file_path = Path(path)
              raw_bytes = _read_bytes_bounded(file_path, max_input_bytes)
              try:
                  decoded_text = raw_bytes.decode("utf-8", errors="strict")
              except UnicodeDecodeError as exc:
                  raise ValueError(f"{file_path}: must be valid UTF-8") from exc
              return _BoundedTextArtifact(
                  text=decoded_text,
                  sha256=hashlib.sha256(raw_bytes).hexdigest(),
                  byte_count=len(raw_bytes),
              )
          '''
          if old_reader not in cli_text:
              raise SystemExit("bounded reader patch anchor is missing")
          cli_text = cli_text.replace(old_reader, new_reader, 1)

          runner_anchor = '''def _run_compare(arguments: argparse.Namespace) -> dict[str, Any]:
          '''
          verification_projection = '''def artifact_verification_to_dict(
              report: ArtifactVerificationReport,
          ) -> dict[str, Any]:
              """Project one immutable verification result to stable JSON data."""
              if not isinstance(report, ArtifactVerificationReport):
                  raise ValueError("report must be ArtifactVerificationReport")
              return {
                  "schema_version": VERIFICATION_OUTPUT_SCHEMA_VERSION,
                  "rankweave_version": _rankweave_version(),
                  "report_schema_version": report.report_schema_version,
                  "verified": report.verified,
                  "artifact_count": len(report.artifacts),
                  "mismatch_count": report.mismatch_count,
                  "artifacts": [
                      {
                          "artifact_role": artifact.artifact_role,
                          "candidate_id": artifact.candidate_id,
                          "expected_sha256": artifact.expected_sha256,
                          "actual_sha256": artifact.actual_sha256,
                          "sha256_matches": artifact.sha256_matches,
                          "expected_byte_count": artifact.expected_byte_count,
                          "actual_byte_count": artifact.actual_byte_count,
                          "byte_count_matches": artifact.byte_count_matches,
                          "verified": artifact.verified,
                      }
                      for artifact in report.artifacts
                  ],
              }


          '''
          if "def artifact_verification_to_dict(" not in cli_text:
              cli_text = cli_text.replace(
                  runner_anchor,
                  verification_projection + runner_anchor,
                  1,
              )

          main_anchor = '''def main(argv: Sequence[str] | None = None) -> int:
          '''
          verification_runner = '''def _run_verify_artifacts(
              arguments: argparse.Namespace,
          ) -> ArtifactVerificationReport:
              """Verify bounded local artifacts against one persisted v2 report."""
              report_artifact = _read_text_artifact_bounded(
                  arguments.report,
                  arguments.max_input_bytes,
              )
              report_data = json.loads(report_artifact.text)
              baseline_run_bytes = _read_bytes_bounded(
                  arguments.baseline_run,
                  arguments.max_input_bytes,
              )
              qrels_bytes = _read_bytes_bounded(
                  arguments.qrels,
                  arguments.max_input_bytes,
              )
              candidate_run_bytes = (
                  None
                  if arguments.candidate_run is None
                  else _read_bytes_bounded(
                      arguments.candidate_run,
                      arguments.max_input_bytes,
                  )
              )
              candidate_run_bytes_by_id = None
              if arguments.candidate_specs is not None:
                  candidate_paths = parse_candidate_specifications(
                      arguments.candidate_specs
                  )
                  candidate_run_bytes_by_id = {
                      candidate_id: _read_bytes_bounded(
                          candidate_path,
                          arguments.max_input_bytes,
                      )
                      for candidate_id, candidate_path in candidate_paths.items()
                  }
              return verify_report_artifacts(
                  report_data,
                  baseline_run_bytes=baseline_run_bytes,
                  candidate_run_bytes=candidate_run_bytes,
                  qrels_bytes=qrels_bytes,
                  candidate_run_bytes_by_id=candidate_run_bytes_by_id,
              )


          '''
          if "def _run_verify_artifacts(" not in cli_text:
              cli_text = cli_text.replace(
                  main_anchor,
                  verification_runner + main_anchor,
                  1,
              )

          old_main = '''def main(argv: Sequence[str] | None = None) -> int:
              """Run the RankWeave CLI and return its process exit status."""
              try:
                  arguments = build_parser().parse_args(argv)
                  if arguments.command == "schema":
                      output_bytes = load_report_schema_text(
                          arguments.report_type,
                          arguments.schema_version,
                      ).encode("utf-8")
                  else:
                      if arguments.command == "compare":
                          payload = _run_compare(arguments)
                      else:
                          payload = _run_compare_family(arguments)
                      if arguments.pretty:
                          rendered_output = json.dumps(
                              payload,
                              ensure_ascii=False,
                              indent=2,
                          )
                      else:
                          rendered_output = json.dumps(
                              payload,
                              ensure_ascii=False,
                              separators=(",", ":"),
                          )
                      output_bytes = rendered_output.encode("utf-8") + b"\\n"
              except (_UsageError, OSError, ValueError) as exc:
                  print(f"rankweave: error: {exc}", file=sys.stderr)
                  return 2

              sys.stdout.buffer.write(output_bytes)
              return 0
          '''
          new_main = '''def main(argv: Sequence[str] | None = None) -> int:
              """Run the RankWeave CLI and return its process exit status."""
              exit_status = 0
              try:
                  arguments = build_parser().parse_args(argv)
                  if arguments.command == "schema":
                      output_bytes = load_report_schema_text(
                          arguments.report_type,
                          arguments.schema_version,
                      ).encode("utf-8")
                  else:
                      if arguments.command == "compare":
                          payload = _run_compare(arguments)
                      elif arguments.command == "compare-family":
                          payload = _run_compare_family(arguments)
                      else:
                          verification = _run_verify_artifacts(arguments)
                          payload = artifact_verification_to_dict(verification)
                          exit_status = 0 if verification.verified else 1
                      if arguments.pretty:
                          rendered_output = json.dumps(
                              payload,
                              ensure_ascii=False,
                              indent=2,
                          )
                      else:
                          rendered_output = json.dumps(
                              payload,
                              ensure_ascii=False,
                              separators=(",", ":"),
                          )
                      output_bytes = rendered_output.encode("utf-8") + b"\\n"
              except (_UsageError, OSError, ValueError) as exc:
                  print(f"rankweave: error: {exc}", file=sys.stderr)
                  return 2

              sys.stdout.buffer.write(output_bytes)
              return exit_status
          '''
          if old_main not in cli_text:
              raise SystemExit("main dispatch patch anchor is missing")
          cli_text = cli_text.replace(old_main, new_main, 1)
          cli_path.write_text(cli_text, encoding="utf-8")

          init_path = Path("src/rankweave/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_import_anchor = "from rankweave.comparison import (\n"
          init_artifact_import = '''from rankweave.artifact_verification import (
              FAMILY_REPORT_SCHEMA_VERSION,
              PAIRWISE_REPORT_SCHEMA_VERSION,
              ArtifactVerificationRecord,
              ArtifactVerificationReport,
              verify_report_artifacts,
          )
          '''
          if init_artifact_import.strip() not in init_text:
              init_text = init_text.replace(
                  init_import_anchor,
                  init_artifact_import + init_import_anchor,
                  1,
              )
          init_text = init_text.replace(
              '__version__ = "0.13.0"',
              '__version__ = "0.14.0"',
              1,
          )
          list_anchor = '    "AggregateRankingMetrics",\n'
          list_entries = (
              '    "ArtifactVerificationRecord",\n'
              '    "ArtifactVerificationReport",\n'
          )
          init_text = init_text.replace(
              list_anchor,
              list_anchor + list_entries,
              1,
          )
          init_text = init_text.replace(
              '    "FusedRankedItem",\n',
              '    "FAMILY_REPORT_SCHEMA_VERSION",\n'
              '    "FusedRankedItem",\n',
              1,
          )
          init_text = init_text.replace(
              '    "PRECISION_AT_K_METRIC",\n',
              '    "PAIRWISE_REPORT_SCHEMA_VERSION",\n'
              '    "PRECISION_AT_K_METRIC",\n',
              1,
          )
          init_text = init_text.replace(
              '    "weighted_reciprocal_rank_fusion_score",\n',
              '    "verify_report_artifacts",\n'
              '    "weighted_reciprocal_rank_fusion_score",\n',
              1,
          )
          init_path.write_text(init_text, encoding="utf-8")

          replace_once(
              "pyproject.toml",
              'version = "0.13.0"',
              'version = "0.14.0"',
          )
          replace_once(
              "tests/test_version.py",
              'EXPECTED_RELEASE_VERSION = "0.13.0"',
              'EXPECTED_RELEASE_VERSION = "0.14.0"',
          )
          PY
          uv lock

      - name: Verify focused and complete suites
        run: |
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check --fix \
            src/rankweave/cli.py src/rankweave/__init__.py \
            tests/test_verify_artifacts_cli.py
          uv run --frozen --extra dev --python 3.13 \
            python -m pytest -q \
            tests/test_artifact_verification.py \
            tests/test_artifact_verification_defensive.py \
            tests/test_verify_artifacts_cli.py
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report

      - name: Commit and push verified CLI implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/rankweave/cli.py src/rankweave/__init__.py \
            pyproject.toml tests/test_version.py \
            tests/test_verify_artifacts_cli.py uv.lock
          git -c core.hooksPath=/dev/null commit \
            -m "feat: expose exact artifact verification through the CLI"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/verify-report-artifacts"
