name: Hourly RankWeave Commercialization Loop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rankweave-hourly-commercialization-loop
  cancel-in-progress: true

jobs:
  inspect-pr-queue:
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e
    with:
      base_branch: main
      max_prs: "50"
      trigger_reviews: true
      review_dispatch_limit: "1"
      branch_update_limit: "1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
    secrets: inherit

  repair-review-feedback:
    needs: inspect-pr-queue
    if: ${{ always() }}
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e
    with:
      target_repository: ContextualWisdomLab/RankWeave
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "1"
    secrets: inherit

  revalidate-pr-queue:
    needs: repair-review-feedback
    if: ${{ always() }}
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e
    with:
      base_branch: main
      max_prs: "50"
      trigger_reviews: true
      review_dispatch_limit: "1"
      branch_update_limit: "1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
    secrets: inherit

  develop-next-product-gap:
    needs: revalidate-pr-queue
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_REPOSITORY: ContextualWisdomLab/RankWeave
      BASE_BRANCH: main
      AGENT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Determine whether product development may start
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${AGENT_TOKEN:-}" ]; then
            echo "::warning::COPILOT_GITHUB_TOKEN is not configured; product development remains fail-closed."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr_count="$(
            gh api "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \
              --jq 'length'
          )"
          if [ "$open_pr_count" -ne 0 ]; then
            echo "An open pull request already owns the development queue."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! tasks_json="$(
            GH_TOKEN="$AGENT_TOKEN" gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/agents/repos/${TARGET_REPOSITORY}/tasks"
          )"; then
            echo "::warning::Unable to list Copilot agent tasks; refusing to create another."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! active_task_count="$(
            TASKS_JSON="$tasks_json" python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["TASKS_JSON"])
          if isinstance(payload, list):
              tasks = payload
          elif isinstance(payload, dict):
              tasks = payload.get("tasks", payload.get("items"))
          else:
              tasks = None
          if not isinstance(tasks, list):
              print("Unsupported agent-task response shape", file=sys.stderr)
              raise SystemExit(1)

          active_states = {"queued", "in_progress", "idle", "waiting_for_user"}
          terminal_states = {"completed", "failed", "timed_out", "cancelled"}
          active_count = 0
          for task in tasks:
              if not isinstance(task, dict):
                  active_count += 1
                  continue
              state = task.get("state")
              if state in active_states or state not in terminal_states:
                  active_count += 1
          print(active_count)
          PY
          )"; then
            echo "::warning::Unable to interpret Copilot agent tasks; refusing to create another."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$active_task_count" -ne 0 ]; then
            echo "A Copilot agent task already owns the development queue."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Start one bounded buyer-visible product task
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          prompt="$(cat <<'PROMPT'
          Continue commercializing ContextualWisdomLab/RankWeave on the main branch.

          First inspect AGENTS.md, README.md, CHANGELOG.md, open issues, recent commits,
          package boundaries, tests, security posture, interoperability, and the natural
          retrieval-engine user journey. Select exactly one highest-impact buyer-visible product gap
          that fits one bounded pull request. Do not create a new repository.

          Work test-first: Write a failing test before production code and verify that it
          fails for the intended reason. Implement the smallest coherent solution, then
          run focused and full validation. Preserve the standard-library-only runtime,
          store-agnostic modular architecture, deterministic behavior, immutable audit
          records, fail-closed input contracts, Python 3.10+ compatibility, 100% line and branch coverage,
          and complete production docstrings. Use authoritative primary
          standards or peer-reviewed evidence for algorithmic defaults and document any
          deliberate compatibility differences.

          Update CHANGELOG.md, README.md, AGENTS.md, research or operations documentation,
          package smoke tests, and version metadata when the slice is release-ready. Use
          Figma or Product Design only when the repository has an actual UI; do not add a
          cosmetic interface to this library. Open exactly one focused pull request that
          explains buyer impact, evidence, compatibility, and executable verification.
          Do not merge your own pull request and do not bypass reviews or required checks.
          PROMPT
          )"

          payload="$(
            jq -n \
              --arg prompt "$prompt" \
              --arg base_ref "$BASE_BRANCH" \
              '{prompt: $prompt, base_ref: $base_ref, create_pull_request: true}'
          )"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/agents/repos/${TARGET_REPOSITORY}/tasks" \
            --input - <<<"$payload"
