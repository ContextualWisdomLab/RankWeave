name: Finalize PR 28 release validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-pr-28-finalizer
  cancel-in-progress: true

jobs:
  finalize-verify-push:
    if: >-
      github.event.pull_request.number == 28 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/trusted-pypi-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/trusted-pypi-release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply final release validation changes
        run: |
          set -euo pipefail
          python .github/scripts/finalize_pr28.py
          rm .github/scripts/finalize_pr28.py
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check --fix tests/test_publish_workflow.py
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified validation and finalizer removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            docs/superpowers/plans/2026-08-05-trusted-pypi-release.md \
            docs/superpowers/specs/2026-08-05-trusted-pypi-release-design.md \
            tests/test_publish_workflow.py
          git add -u .github/scripts/finalize_pr28.py
          git -c core.hooksPath=/dev/null commit \
            -m "ci: verify source distributions before release"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci/trusted-pypi-release"
