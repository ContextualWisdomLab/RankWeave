name: Harden release dispatch ref once

on:
  push:
    branches: [release/governed-0.18.0-publication]
    paths:
      - .github/workflows/harden-release-dispatch-ref.yml

permissions:
  contents: write

jobs:
  harden-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/governed-0.18.0-publication
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Pin publisher dispatch to the immutable release tag
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/create-release.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_workflow = '            --ref main \\\n'
          new_workflow = '            --ref "$RELEASE_TAG" \\\n'
          if workflow.count(old_workflow) != 1:
              raise SystemExit("expected one mutable publisher dispatch ref")
          workflow_path.write_text(
              workflow.replace(old_workflow, new_workflow, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/test_create_release_workflow.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = '        "--ref main",\n'
          new_test = '        "--ref \\"$RELEASE_TAG\\"",\n'
          if tests.count(old_test) != 1:
              raise SystemExit("expected one mutable dispatch assertion")
          test_path.write_text(
              tests.replace(old_test, new_test, 1),
              encoding="utf-8",
          )
          PY
          rm .github/workflows/harden-release-dispatch-ref.yml
      - name: Verify hardened release contracts
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m pytest \
            tests/test_create_release_workflow.py \
            tests/test_publish_workflow.py -q
      - name: Commit verified immutable dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "ci: dispatch publication from the release tag"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/release/governed-0.18.0-publication"
