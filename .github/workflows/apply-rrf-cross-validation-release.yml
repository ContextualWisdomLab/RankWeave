name: Apply weighted-RRF cross-validation release

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-33-rrf-cross-validation-release
  cancel-in-progress: true

jobs:
  apply-verify-push:
    if: >-
      github.event.pull_request.number == 33 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/auditable-rrf-cross-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/auditable-rrf-cross-validation
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending updater
        id: gate
        run: |
          if [ -f .github/scripts/apply_rrf_cross_validation_release.py ]; then
            echo "apply=true" >>"$GITHUB_OUTPUT"
          else
            echo "apply=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - if: steps.gate.outputs.apply == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply and verify the reviewed release
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python .github/scripts/apply_rrf_cross_validation_release.py
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified non-workflow release updates
        if: steps.gate.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git restore --source=HEAD -- .github/workflows/ci.yml
          rm .github/scripts/apply_rrf_cross_validation_release.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/generated-ci.yml \
            AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md README.md \
            docs/releasing.md docs/research/README.md \
            pyproject.toml src/rankweave/__init__.py \
            tests/test_temporal_release_contract.py \
            tests/test_verification_schema.py \
            tests/test_verify_artifacts_cli.py tests/test_version.py \
            uv.lock
          git add -u .github/scripts/apply_rrf_cross_validation_release.py
          git -c core.hooksPath=/dev/null commit \
            -m "release: prepare RankWeave 0.18.0"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/auditable-rrf-cross-validation"
