name: Update PR 26 release documentation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-pr-26-documentation
  cancel-in-progress: true

jobs:
  update-and-verify:
    if: >-
      github.event.pull_request.number == 26 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/report-json-schemas'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/report-json-schemas
          fetch-depth: 0
          persist-credentials: false

      - name: Update release and architecture documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"documentation anchor missing: {path_text}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog_section = '''## [Unreleased]\n\n## [0.13.0] — 2026-08-05\n\n### Added\n- Four strict JSON Schema Draft 2020-12 resources for pairwise and candidate-family v1/v2 report transports.\n- Public `ReportSchemaDescriptor`, `available_report_schemas`, `load_report_schema_text`, and `load_report_schema` APIs for standalone and MSA consumers.\n- The `rankweave schema` console and module command for deterministic UTF-8 schema discovery in shell, CI, and container workflows.\n- Installed-wheel verification for all schema resources and console/module schema-output parity.\n\n### Changed\n- RankWeave 0.13.0 publishes existing report contracts without changing pairwise or candidate-family v1/v2 report semantics.\n- Development validation uses the reference `jsonschema` implementation while the runtime remains standard-library-only.\n\n### Security\n- Every schema is strict about required fields and rejects additional object properties, malformed digest evidence, unsupported metrics, and invalid value domains.\n- Successful structural validation is documented as neither report authenticity, artifact-digest verification, trusted execution, nor scientific validity.\n\n'''
          replace_once(
              "CHANGELOG.md",
              "## [Unreleased]\n\n",
              changelog_section,
          )

          readme_section = '''## Discover machine-readable report contracts\n\nRankWeave 0.13.0 ships strict JSON Schema Draft 2020-12 resources for every\npairwise and candidate-family v1/v2 transport. Shell and container consumers\ncan retrieve the exact installed contract without locating package files:\n\n```bash\nrankweave schema --report-type pairwise --schema-version v2\n```\n\nThe equivalent module entrypoint is:\n\n```bash\npython -m rankweave schema --report-type family --schema-version v1\n```\n\nPython and MSA consumers can use the dependency-free resource API:\n\n```python\nfrom rankweave import available_report_schemas, load_report_schema\n\nfor descriptor in available_report_schemas():\n    schema = load_report_schema(\n        descriptor.report_type,\n        descriptor.schema_version,\n    )\n    assert schema["properties"]["schema_version"]["const"] == (\n        descriptor.transport_schema_id\n    )\n```\n\nThe runtime does not embed a validator. Consumers select a conforming Draft\n2020-12 implementation appropriate to their platform. Structural validation\ndoes not authenticate a report, verify external artifact bytes, or establish\nthat a statistical conclusion is scientifically valid. See\n[Report JSON Schemas](docs/report-schemas.md).\n\n'''
          replace_once(
              "README.md",
              "## Input and determinism guarantees\n",
              readme_section + "## Input and determinism guarantees\n",
          )

          cli_section = '''## Emit machine-readable report schemas\n\nThe installed package exposes each stable report contract as canonical UTF-8\nJSON Schema Draft 2020-12 text:\n\n```bash\nrankweave schema \\\n  --report-type pairwise \\\n  --schema-version v2 > pairwise-v2.schema.json\n```\n\n```bash\npython -m rankweave schema \\\n  --report-type family \\\n  --schema-version v1 > family-v1.schema.json\n```\n\n`--report-type` accepts `pairwise` or `family`; `--schema-version` accepts `v1`\nor `v2`. The command reads only packaged resources, performs no network or\nfilesystem input access, writes one canonical UTF-8 JSON document, and retains\nthe stderr-only exit-2 usage contract. Console and module output are\nbyte-identical.\n\nThe runtime deliberately does not provide a partial validator. Use a conforming\nDraft 2020-12 implementation in the consuming service. A valid document has the\nrequired structure; this alone does not authenticate its producer or verify its\nstatistical claims.\n\n'''
          replace_once(
              "docs/cli.md",
              "## Shared options\n",
              cli_section + "## Shared options\n",
          )

          agent_rule = '''- **Report schemas are public compatibility contracts.** The packaged Draft\n  2020-12 resources must describe every emitted pairwise and family v1/v2\n  document exactly. Keep all objects strict, preserve stable resource discovery\n  order, validate real generated reports in development tests, and verify every\n  resource from an installed wheel. Do not add a runtime validator dependency.\n'''
          replace_once(
              "AGENTS.md",
              "- **CLI input is bounded.** Every artifact read requests no more than\n",
              agent_rule
              + "- **CLI input is bounded.** Every artifact read requests no more than\n",
          )
          replace_once(
              "AGENTS.md",
              "- `src/rankweave/__main__.py` — module entrypoint only.\n",
              "- `src/rankweave/report_schemas.py` — stable schema discovery and package-resource loading.\n"
              "- `src/rankweave/schemas/` — strict Draft 2020-12 report contracts shipped in the wheel.\n"
              "- `src/rankweave/__main__.py` — module entrypoint only.\n",
          )
          replace_once(
              "AGENTS.md",
              "- `docs/cli.md` — installed commands, v1/v2 JSON schemas, artifact verification,\n  and operator boundaries.\n",
              "- `docs/cli.md` — installed commands, report transports, artifact verification,\n  and operator boundaries.\n"
              "- `docs/report-schemas.md` — machine-readable schema discovery, validation,\n  compatibility, and interpretation boundaries.\n",
          )

          research_bullet = '''- **JSON Schema Core and Validation Draft 2020-12** define the media type,\n  vocabularies, structural assertion keywords, and meta-schema used by the\n  packaged report contracts.\n'''
          replace_once(
              "docs/research/README.md",
              "- **RFC 8259** requires interoperable JSON exchanged outside a closed ecosystem\n",
              research_bullet
              + "- **RFC 8259** requires interoperable JSON exchanged outside a closed ecosystem\n",
          )

          research_section = '''## Machine-readable report contracts\n\nRankWeave packages four strict JSON Schema Draft 2020-12 documents describing\nthe established pairwise and candidate-family v1/v2 report structures. The\nCore specification defines schema identification, references, vocabularies,\nand annotation behavior; the Validation specification defines the assertion\nkeywords used for types, required properties, numeric domains, arrays, enums,\nconstants, and string patterns.\n\nThe schemas set `additionalProperties: false` on report objects and constrain\nknown metric, alternative, randomization-method, SHA-256, and byte-count\ndomains. Cross-field invariants such as candidate-count equality, candidate\nordering, and query alignment remain documented with `$comment` because a\nportable schema cannot express all domain semantics. RankWeave generation and\nstatistical APIs continue to enforce those invariants.\n\nSchema validation is a structural compatibility check only. It neither\nauthenticates a producer, recomputes a digest, proves trusted execution, nor\nassesses whether an experimental design supports the reported inference.\n\n'''
          replace_once(
              "docs/research/README.md",
              "## Autonomous source and credential boundaries\n",
              research_section + "## Autonomous source and credential boundaries\n",
          )

          json_schema_references = '''Wright, A., Andrews, H., Hutton, B., & Dennis, G. (2022). *JSON Schema: A\nmedia type for describing JSON documents* (Draft 2020-12). JSON Schema.\nhttps://json-schema.org/draft/2020-12/json-schema-core.html\n\nWright, A., Andrews, H., Hutton, B., & Dennis, G. (2022). *JSON Schema\nvalidation: A vocabulary for structural validation of JSON* (Draft 2020-12).\nJSON Schema.\nhttps://json-schema.org/draft/2020-12/json-schema-validation.html\n\n'''
          replace_once(
              "docs/research/README.md",
              "Bruch, S., Gai, S., & Ingber, A. (2024). An analysis of fusion functions for\n",
              json_schema_references
              + "Bruch, S., Gai, S., & Ingber, A. (2024). An analysis of fusion functions for\n",
          )

          Path("CLAUDE.md").write_text(
              '''# CLAUDE.md — RankWeave\n\nAll automated contributors must follow [`AGENTS.md`](AGENTS.md) and the\narchitectural boundaries in [`ARCHITECTURE.md`](ARCHITECTURE.md).\n\nRankWeave is a standard-library-only runtime. Keep statistical arithmetic in\nthe pure Python core, keep CLI behavior as a transport adapter, preserve\nstandalone and naruon/MSA use, write tests before behavior changes, and maintain\n100% production statement and branch coverage plus complete public docstrings.\n\nReport JSON Schemas are public compatibility resources. Any transport change\nrequires synchronized schema, tests, installed-wheel smoke, documentation, and\nrelease metadata. Do not use `COPILOT_GITHUB_TOKEN`; the governed product loop\nuses the existing `NVIDIA_NIM_API_KEY` OpenCode path without altering review\nagent credentials.\n''',
              encoding="utf-8",
          )

          Path("docs/report-schemas.md").write_text(
              '''# RankWeave report JSON Schemas\n\n## Available contracts\n\nRankWeave 0.13.0 ships four JSON Schema Draft 2020-12 resources:\n\n| Report type | Version | Transport identifier |\n|---|---|---|\n| pairwise | v1 | `rankweave.trec-comparison.v1` |\n| pairwise | v2 | `rankweave.trec-comparison.v2` |\n| family | v1 | `rankweave.trec-family-comparison.v1` |\n| family | v2 | `rankweave.trec-family-comparison.v2` |\n\nThe v1 contracts remain the default report transports. V2 is opt-in through\n`--include-artifact-digests` and adds exact-byte SHA-256 and byte-count evidence.\n\n## Discovery\n\n```bash\nrankweave schema --report-type pairwise --schema-version v1\npython -m rankweave schema --report-type family --schema-version v2\n```\n\n```python\nfrom rankweave import available_report_schemas, load_report_schema\n\nfor descriptor in available_report_schemas():\n    schema = load_report_schema(\n        descriptor.report_type,\n        descriptor.schema_version,\n    )\n```\n\n`load_report_schema_text` returns canonical packaged UTF-8 text with one trailing\nnewline. `load_report_schema` returns a fresh dictionary on every call. Unknown\nselectors fail closed.\n\n## Validation boundary\n\nRankWeave intentionally has no runtime validator dependency. Consumers should\nvalidate with a conforming Draft 2020-12 implementation. The development suite\nuses the reference Python `jsonschema` package to check every schema and real\ngenerated v1/v2 report.\n\nThe schemas reject missing fields, additional object properties, unsupported\nmetrics and alternatives, malformed SHA-256 values, and invalid numerical\ndomains. `$comment` records cross-field invariants that remain the responsibility\nof RankWeave generation or a domain-aware consumer.\n\nStructural conformance is not producer authentication, digital signature\nverification, external artifact-digest verification, trusted-execution evidence,\nor scientific validation.\n\n## Compatibility policy\n\nPublished schema resources are immutable descriptions of their transport\nidentifiers. Additive package releases may retain the same schema resources. An\nincompatible transport change requires a new transport identifier, new packaged\nschema, complete regression coverage, installed-wheel smoke, documentation, and\nrelease notes.\n''',
              encoding="utf-8",
          )
          PY

      - name: Verify documentation and full source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("ARCHITECTURE.md"),
              Path("CLAUDE.md"),
              Path("CHANGELOG.md"),
              Path("docs/report-schemas.md"),
              Path("docs/research/README.md"),
          ]
          for path in required:
              text = path.read_text(encoding="utf-8")
              assert text.strip()
              assert "TODO" not in text
              assert "TBD" not in text
          assert "## [0.13.0] — 2026-08-05" in required[2].read_text(
              encoding="utf-8"
          )
          PY

      - name: Commit and push verified documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md ARCHITECTURE.md CLAUDE.md CHANGELOG.md README.md \
            docs/cli.md docs/report-schemas.md docs/research/README.md
          git -c core.hooksPath=/dev/null commit \
            -m "docs: publish RankWeave 0.13.0 schema contracts"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/report-json-schemas"
