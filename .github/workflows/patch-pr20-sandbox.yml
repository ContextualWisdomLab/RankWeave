name: Patch PR 20 sandbox hardening

on:
  push:
    branches:
      - nim/hourly-commercialization-loop

permissions:
  contents: write

concurrency:
  group: patch-pr20-sandbox-hardening
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply sandbox hardening and remove this workflow
        run: |
          set -euo pipefail
          python .github/scripts/apply_pr20_sandbox_patch.py

      - name: Verify the repaired branch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report
          python .github/scripts/materialize_workspace.py --help >/dev/null

      - name: Commit and push the verified repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: isolate autonomous tests from trusted credentials"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/nim/hourly-commercialization-loop"
