name: Apply PR 20 final hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-pr20-final-hardening
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.head_ref == 'nim/hourly-commercialization-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nim/hourly-commercialization-loop
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and verify the final hardening
        run: python .github/scripts/apply_pr20_final_hardening.py

      - name: Commit and push the verified result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: run autonomous tests without trusted privileges"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/nim/hourly-commercialization-loop"
