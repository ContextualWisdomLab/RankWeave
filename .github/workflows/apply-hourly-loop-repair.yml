name: Apply hourly loop reachability repair once

on:
  push:
    branches: [fix/hourly-loop-reachable-governance]
    paths:
      - .github/workflows/apply-hourly-loop-repair.yml
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-hourly-loop-reachable-governance
  cancel-in-progress: false

jobs:
  apply-verify-push:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.ref == 'fix/hourly-loop-reachable-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/hourly-loop-reachable-governance
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply reviewed repair and remove bootstrap files
        run: |
          set -euo pipefail
          python .github/scripts/apply_hourly_loop_repair.py
          rm .github/scripts/apply_hourly_loop_repair.py
          rm .github/workflows/apply-hourly-loop-repair.yml
      - name: Verify focused and full repository contracts
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m pytest tests/test_hourly_commercialization_workflow.py -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified durable repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "fix(ci): restore executable hourly governance"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/fix/hourly-loop-reachable-governance"
