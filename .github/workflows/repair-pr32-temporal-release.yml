name: Repair RankWeave PR 32 temporal release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-pr32-temporal-release.yml
      - .github/scripts/repair_pr32_temporal_release.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted repair source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: repair-source
          persist-credentials: false
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/temporal-convex-backtesting
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply reviewed non-workflow release metadata
        run: >-
          python repair-source/.github/scripts/repair_pr32_temporal_release.py
          target
      - name: Verify exact branch contents
        working-directory: target
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified metadata to the PR branch
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock README.md docs/releasing.md \
            tests/test_verify_artifacts_cli.py CHANGELOG.md \
            ARCHITECTURE.md AGENTS.md CLAUDE.md docs/research/README.md
          if git diff --cached --quiet; then
            echo "No metadata changes remain."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit \
            -m "release: synchronize RankWeave 0.17.0 metadata"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/temporal-convex-backtesting"
