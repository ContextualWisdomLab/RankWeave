name: Create RankWeave Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version without the v prefix
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/create-release.yml

permissions: {}

concurrency:
  group: rankweave-release-${{ inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.identity.outputs.release_version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      verified_sha: ${{ steps.identity.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Resolve and verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          SOURCE_VERSION="$(python - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          source_version = project["project"]["version"]

          package_text = Path("src/rankweave/__init__.py").read_text(
              encoding="utf-8"
          )
          public_match = re.search(
              r'^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$',
              package_text,
              re.MULTILINE,
          )
          if public_match is None:
              raise SystemExit("rankweave.__version__ is missing or invalid")

          version_test = Path("tests/test_version.py").read_text(
              encoding="utf-8"
          )
          expected_match = re.search(
              r'^EXPECTED_RELEASE_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$',
              version_test,
              re.MULTILINE,
          )
          if expected_match is None:
              raise SystemExit("EXPECTED_RELEASE_VERSION is missing or invalid")

          identities = {
              source_version,
              public_match.group(1),
              expected_match.group(1),
          }
          if len(identities) != 1:
              raise SystemExit(
                  "source version, rankweave.__version__, and "
                  "EXPECTED_RELEASE_VERSION must match"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          release_heading = re.compile(
              rf"^## \[{re.escape(source_version)}\] - "
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}$",
              re.MULTILINE,
          )
          if release_heading.search(changelog) is None:
              raise SystemExit(
                  f"CHANGELOG.md lacks release heading for {source_version}"
              )
          print(source_version)
          PY
          )"
          export SOURCE_VERSION

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$SOURCE_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must match [0-9]+.[0-9]+.[0-9]+" >&2
            exit 1
          fi
          if [[ "$version" != "$SOURCE_VERSION" ]]; then
            echo "release version must match source version" >&2
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$EVENT_SHA" ]]; then
            echo "checked-out commit must equal the workflow event SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
            "$checked_out_sha" "origin/$DEFAULT_BRANCH"; then
            echo "release commit must be reachable from origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

          release_tag="v${version}"
          encoded_tag="$(python - "$release_tag" <<'PY'
          from sys import argv
          from urllib.parse import quote

          print(quote(argv[1], safe=""))
          PY
          )"

          pypi_status="$(
            curl --silent --show-error --location \
              --output /tmp/rankweave-pypi-version.json \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/rankweave/${version}/json"
          )"
          case "$pypi_status" in
            404) ;;
            200)
              echo "PyPI version already exists: ${version}" >&2
              exit 1
              ;;
            *)
              echo "unexpected PyPI response: ${pypi_status}" >&2
              exit 1
              ;;
          esac

          github_status() {
            local api_path="$1"
            local output_path="$2"
            curl --silent --show-error --location \
              --output "$output_path" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}${api_path}"
          }

          tag_status="$(github_status \
            "/git/ref/tags/${encoded_tag}" /tmp/rankweave-tag.json)"
          case "$tag_status" in
            404) ;;
            200)
              echo "Git tag already exists: ${release_tag}" >&2
              exit 1
              ;;
            *)
              echo "unexpected GitHub API response for tag: ${tag_status}" >&2
              exit 1
              ;;
          esac

          release_status="$(github_status \
            "/releases/tags/${encoded_tag}" /tmp/rankweave-release.json)"
          case "$release_status" in
            404) ;;
            200)
              echo "GitHub Release already exists: ${release_tag}" >&2
              exit 1
              ;;
            *)
              echo "unexpected GitHub API response for release: ${release_status}" >&2
              exit 1
              ;;
          esac

          {
            printf 'release_version=%s\n' "$version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'verified_sha=%s\n' "$checked_out_sha"
          } >>"$GITHUB_OUTPUT"
      - name: Run complete release quality gate
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          set -euo pipefail
          rm -rf dist release-handoff
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
          uv run --frozen --extra dev --python 3.13 python \
            scripts/verify_release_archives.py \
            --dist-dir dist \
            --version "$RELEASE_VERSION" \
            --wheel-tag linux \
            --require-sdist
      - name: Extract deterministic release notes
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          release_heading="## [${version}]"
          grep --fixed-strings --quiet "$release_heading" CHANGELOG.md
          mkdir -p release-handoff
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}$",
              re.MULTILINE,
          )
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"release notes missing for {version}")
          next_heading = re.search(
              r"^## \[",
              changelog[match.end() :],
              re.MULTILINE,
          )
          end = (
              match.end() + next_heading.start()
              if next_heading is not None
              else len(changelog)
          )
          body = changelog[match.end() : end].strip()
          if not body:
              raise SystemExit(f"release notes are empty for {version}")
          notes = f"# RankWeave {version}\n\n{body}\n"
          Path("release-handoff/RELEASE_NOTES.md").write_text(
              notes,
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-release-notes
          path: release-handoff/RELEASE_NOTES.md
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-release-notes
          path: release-handoff/
      - name: Recheck state and create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          encoded_tag="$(python - "$RELEASE_TAG" <<'PY'
          from sys import argv
          from urllib.parse import quote

          print(quote(argv[1], safe=""))
          PY
          )"
          github_status() {
            local api_path="$1"
            local output_path="$2"
            curl --silent --show-error --location \
              --output "$output_path" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}${api_path}"
          }
          tag_status="$(github_status \
            "/git/ref/tags/${encoded_tag}" /tmp/rankweave-tag.json)"
          release_status="$(github_status \
            "/releases/tags/${encoded_tag}" /tmp/rankweave-release.json)"
          if [[ "$tag_status" != "404" ]]; then
            echo "Git tag state changed before release: ${tag_status}" >&2
            exit 1
          fi
          if [[ "$release_status" != "404" ]]; then
            echo "GitHub Release state changed before mutation: ${release_status}" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "RankWeave $RELEASE_VERSION" \
            --notes-file release-handoff/RELEASE_NOTES.md

  publish_dispatch:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the exact release to the publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f release_tag="$RELEASE_TAG" \
            -f release_sha="$VERIFIED_SHA"
