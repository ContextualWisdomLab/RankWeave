name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel_path = next(Path("dist").glob("rankweave-*.whl"))
          with ZipFile(wheel_path) as wheel_file:
              wheel_members = set(wheel_file.namelist())
          required_members = {
              "rankweave/__init__.py",
              "rankweave/__main__.py",
              "rankweave/cli.py",
              "rankweave/comparison.py",
              "rankweave/evaluation.py",
              "rankweave/trec.py",
              "rankweave/trec_comparison.py",
              "rankweave/trec_family_comparison.py",
              "rankweave/tuning.py",
              "rankweave/py.typed",
          }
          missing_members = required_members - wheel_members
          if missing_members:
              raise SystemExit(f"wheel is missing: {sorted(missing_members)!r}")
          PY
      - run: python -m venv .package-smoke
      - run: >-
          .package-smoke/bin/python -m pip install
          --no-index --find-links dist rankweave
      - name: Smoke-test installed wheel
        run: |
          .package-smoke/bin/python - <<'PY'
          from importlib.metadata import version

          import rankweave

          assert version("rankweave") == rankweave.__version__
          assert rankweave.reciprocal_rank_fuse({"dense": ["document"]})
          metrics = rankweave.evaluate_ranking(
              ["document"], {"document": 1}, cutoff=1
          )
          assert metrics.ndcg_at_k == 1.0
          tuning = rankweave.tune_weighted_reciprocal_rank_fusion(
              {"query": {"dense": ["document"]}},
              {"query": {"document": 1}},
              {"dense-only": {"dense": 1.0}},
              cutoff=1,
          )
          assert tuning.best_policy_id == "dense-only"
          trec_report = rankweave.evaluate_trec_run(
              "q Q0 document 1 1.0 rw1\n",
              "q 0 document 1\n",
              cutoff=1,
          )
          assert trec_report.aggregate.mean_ndcg_at_k == 1.0
          comparison = rankweave.compare_rankings(
              {"q": ["other", "document"]},
              {"q": ["document", "other"]},
              {"q": {"document": 1}},
              cutoff=1,
              alternative=rankweave.CANDIDATE_GREATER_ALTERNATIVE,
          )
          assert comparison.significance.mean_difference == 1.0
          trec_comparison = rankweave.compare_trec_runs(
              "q Q0 other 1 0.9 baseline\n"
              "q Q0 document 2 0.2 baseline\n",
              "q Q0 document 1 0.9 candidate\n"
              "q Q0 other 2 0.2 candidate\n",
              "q 0 document 1\nq 0 other 0\n",
              cutoff=1,
              alternative=rankweave.CANDIDATE_GREATER_ALTERNATIVE,
          )
          assert trec_comparison.baseline_run.run_id == "baseline"
          assert trec_comparison.candidate_run.run_id == "candidate"
          assert trec_comparison.comparison.significance.mean_difference == 1.0
          family = rankweave.compare_trec_run_family(
              "q Q0 other 1 0.9 baseline\n"
              "q Q0 document 2 0.2 baseline\n",
              {
                  "candidate": (
                      "q Q0 document 1 0.9 candidate\n"
                      "q Q0 other 2 0.2 candidate\n"
                  )
              },
              "q 0 document 1\nq 0 other 0\n",
              cutoff=1,
              alternative=rankweave.CANDIDATE_GREATER_ALTERNATIVE,
          )
          assert family.candidates[0].candidate_id == "candidate"
          assert family.candidates[0].raw_p_value == 0.5
          assert family.candidates[0].holm_adjusted_p_value == 0.5
          PY
      - name: Smoke-test installed console command outside source tree
        run: |
          set -euo pipefail
          venv_bin="$PWD/.package-smoke/bin"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cat >"$smoke_dir/baseline.run" <<'EOF'
          q Q0 other 1 0.9 baseline
          q Q0 document 2 0.2 baseline
          EOF
          cat >"$smoke_dir/candidate.run" <<'EOF'
          q Q0 document 1 0.9 candidate
          q Q0 other 2 0.2 candidate
          EOF
          cat >"$smoke_dir/candidate-b.run" <<'EOF'
          q Q0 document 1 0.95 candidate-b
          q Q0 other 2 0.1 candidate-b
          EOF
          cat >"$smoke_dir/qrels.txt" <<'EOF'
          q 0 document 1
          q 0 other 0
          EOF
          (
            cd "$smoke_dir"
            "$venv_bin/rankweave" compare \
              --baseline-run baseline.run \
              --candidate-run candidate.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --alternative candidate-greater > report.json
            "$venv_bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("report.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == "rankweave.trec-comparison.v1"
          assert report["rankweave_version"] == "0.11.1"
          assert report["baseline_run_id"] == "baseline"
          assert report["candidate_run_id"] == "candidate"
          assert report["mean_difference"] == 1.0
          PY
            "$venv_bin/python" -m rankweave compare \
              --baseline-run baseline.run \
              --candidate-run candidate.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --alternative candidate-greater > module-report.json
            cmp report.json module-report.json

            "$venv_bin/rankweave" compare-family \
              --baseline-run baseline.run \
              --candidate first=candidate.run \
              --candidate second=candidate-b.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --alternative candidate-greater > family-report.json
            "$venv_bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("family-report.json").read_text(encoding="utf-8")
          )
          assert report["schema_version"] == (
              "rankweave.trec-family-comparison.v1"
          )
          assert report["rankweave_version"] == "0.11.1"
          assert report["baseline_run_id"] == "baseline"
          assert report["candidate_count"] == 2
          assert [candidate["candidate_id"] for candidate in report["candidates"]] == [
              "first",
              "second",
          ]
          assert [
              candidate["candidate_run_id"] for candidate in report["candidates"]
          ] == ["candidate", "candidate-b"]
          PY
            "$venv_bin/python" -m rankweave compare-family \
              --baseline-run baseline.run \
              --candidate first=candidate.run \
              --candidate second=candidate-b.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --alternative candidate-greater > family-module-report.json
            cmp family-report.json family-module-report.json
          )
      - run: .package-smoke/bin/python -m pip check
