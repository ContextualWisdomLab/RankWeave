name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: >-
          uv run --frozen --extra dev
          --python "${{ matrix.python-version }}"
          python -m compileall -q src
      - run: >-
          uv run --frozen --extra dev
          --python "${{ matrix.python-version }}"
          python -m ruff check .
      - run: >-
          uv run --frozen --extra dev
          --python "${{ matrix.python-version }}"
          python -m coverage run -m pytest -q
      - run: >-
          uv run --frozen --extra dev
          --python "${{ matrix.python-version }}"
          python -m coverage report

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.13
      - run: uv build --wheel --sdist --out-dir dist
      - name: Verify wheel contents
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel_path = next(Path("dist").glob("rankweave-*.whl"))
          with ZipFile(wheel_path) as wheel_file:
              wheel_members = set(wheel_file.namelist())
          required_members = {
              "rankweave/__init__.py",
              "rankweave/__main__.py",
              "rankweave/_validation.py",
              "rankweave/artifact_verification.py",
              "rankweave/cli.py",
              "rankweave/comparison.py",
              "rankweave/evaluation.py",
              "rankweave/query_normalization.py",
              "rankweave/ranked_list_fusion.py",
              "rankweave/report_schemas.py",
              "rankweave/score_fusion.py",
              "rankweave/schemas/__init__.py",
              "rankweave/schemas/artifact-verification-v1.schema.json",
              "rankweave/schemas/trec-comparison-v1.schema.json",
              "rankweave/schemas/trec-comparison-v2.schema.json",
              "rankweave/schemas/trec-family-comparison-v1.schema.json",
              "rankweave/schemas/trec-family-comparison-v2.schema.json",
              "rankweave/trec.py",
              "rankweave/trec_comparison.py",
              "rankweave/trec_family_comparison.py",
              "rankweave/tuning.py",
              "rankweave/py.typed",
          }
          missing_members = required_members - wheel_members
          if missing_members:
              raise SystemExit(f"wheel is missing: {sorted(missing_members)!r}")
          PY
      - name: Verify source distribution contents
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tarfile

          source_distributions = tuple(
              Path("dist").glob("rankweave-*.tar.gz")
          )
          if len(source_distributions) != 1:
              raise SystemExit(
                  "package job requires exactly one source distribution"
              )
          source_distribution = source_distributions[0]
          source_root = source_distribution.name.removesuffix(".tar.gz") + "/"
          with open_tarfile(source_distribution, "r:gz") as archive:
              source_members = set(archive.getnames())
          required_source_members = {
              source_root + "pyproject.toml",
              source_root + "README.md",
              source_root + "CHANGELOG.md",
              source_root + "LICENSE",
              source_root + "src/rankweave/__init__.py",
              source_root + "tests/test_version.py",
          }
          missing_source_members = required_source_members - source_members
          if missing_source_members:
              raise SystemExit(
                  "source distribution is missing: "
                  f"{sorted(missing_source_members)!r}"
              )
          PY
      - run: uv venv .package-smoke --python 3.13
      - run: >-
          uv pip install --python .package-smoke/bin/python
          --no-index --find-links dist rankweave
      - name: Smoke-test installed APIs and schema resources
        run: |
          .package-smoke/bin/python - <<'PY'
          import hashlib
          import json
          from importlib.metadata import version
          from importlib.util import find_spec

          import rankweave

          assert version("rankweave") == "0.14.0"
          assert rankweave.__version__ == "0.14.0"
          assert find_spec("jsonschema") is None

          expected = [
              ("pairwise", "v1", "rankweave.trec-comparison.v1"),
              ("pairwise", "v2", "rankweave.trec-comparison.v2"),
              ("family", "v1", "rankweave.trec-family-comparison.v1"),
              ("family", "v2", "rankweave.trec-family-comparison.v2"),
              (
                  "verification",
                  "v1",
                  "rankweave.artifact-verification.v1",
              ),
          ]
          descriptors = rankweave.available_report_schemas()
          assert [
              (
                  descriptor.report_type,
                  descriptor.schema_version,
                  descriptor.transport_schema_id,
              )
              for descriptor in descriptors
          ] == expected
          for descriptor in descriptors:
              text = rankweave.load_report_schema_text(
                  descriptor.report_type,
                  descriptor.schema_version,
              )
              schema = rankweave.load_report_schema(
                  descriptor.report_type,
                  descriptor.schema_version,
              )
              assert text.endswith("\n")
              assert json.loads(text) == schema
              assert schema["properties"]["schema_version"]["const"] == (
                  descriptor.transport_schema_id
              )

          baseline = b"baseline\n"
          candidate = b"candidate\n"
          qrels = b"qrels\n"

          def evidence(payload):
              return {
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "byte_count": len(payload),
              }

          report = {
              "schema_version": rankweave.PAIRWISE_REPORT_SCHEMA_VERSION,
              "artifacts": {
                  "baseline_run": evidence(baseline),
                  "candidate_run": evidence(candidate),
                  "qrels": evidence(qrels),
              },
          }
          verification = rankweave.verify_report_artifacts(
              report,
              baseline_run_bytes=baseline,
              candidate_run_bytes=candidate,
              qrels_bytes=qrels,
          )
          assert verification.verified is True
          assert verification.mismatch_count == 0
          PY
      - name: Smoke-test installed console and module commands outside source tree
        run: |
          set -euo pipefail
          venv_bin="$PWD/.package-smoke/bin"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          cat >"$smoke_dir/baseline.run" <<'EOF'
          q Q0 other 1 0.9 baseline
          q Q0 document 2 0.2 baseline
          EOF
          cat >"$smoke_dir/candidate.run" <<'EOF'
          q Q0 document 1 0.9 candidate
          q Q0 other 2 0.2 candidate
          EOF
          cat >"$smoke_dir/candidate-b.run" <<'EOF'
          q Q0 document 1 0.95 candidate-b
          q Q0 other 2 0.1 candidate-b
          EOF
          cat >"$smoke_dir/qrels.txt" <<'EOF'
          q 0 document 1
          q 0 other 0
          EOF

          (
            cd "$smoke_dir"

            "$venv_bin/rankweave" schema \
              --report-type verification \
              --schema-version v1 > verification.schema.json
            "$venv_bin/python" -m rankweave schema \
              --report-type verification \
              --schema-version v1 > verification.module.schema.json
            cmp verification.schema.json verification.module.schema.json

            "$venv_bin/rankweave" compare \
              --baseline-run baseline.run \
              --candidate-run candidate.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --include-artifact-digests > pairwise.json
            "$venv_bin/rankweave" compare-family \
              --baseline-run baseline.run \
              --candidate first=candidate.run \
              --candidate second=candidate-b.run \
              --qrels qrels.txt \
              --cutoff 1 \
              --include-artifact-digests > family.json

            "$venv_bin/rankweave" verify-artifacts \
              --report pairwise.json \
              --baseline-run baseline.run \
              --candidate-run candidate.run \
              --qrels qrels.txt > pairwise-verification.json
            "$venv_bin/python" -m rankweave verify-artifacts \
              --report pairwise.json \
              --baseline-run baseline.run \
              --candidate-run candidate.run \
              --qrels qrels.txt > pairwise-verification.module.json
            cmp pairwise-verification.json pairwise-verification.module.json

            "$venv_bin/rankweave" verify-artifacts \
              --report family.json \
              --baseline-run baseline.run \
              --candidate first=candidate.run \
              --candidate second=candidate-b.run \
              --qrels qrels.txt > family-verification.json
            "$venv_bin/python" -m rankweave verify-artifacts \
              --report family.json \
              --baseline-run baseline.run \
              --candidate first=candidate.run \
              --candidate second=candidate-b.run \
              --qrels qrels.txt > family-verification.module.json
            cmp family-verification.json family-verification.module.json

            cp candidate.run candidate-mismatch.run
            printf '# mismatch\n' >> candidate-mismatch.run
            set +e
            "$venv_bin/rankweave" verify-artifacts \
              --report pairwise.json \
              --baseline-run baseline.run \
              --candidate-run candidate-mismatch.run \
              --qrels qrels.txt > mismatch.json
            mismatch_status=$?
            set -e
            test "$mismatch_status" -eq 1

            "$venv_bin/python" - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(
              Path("verification.schema.json").read_text(encoding="utf-8")
          )
          assert schema["properties"]["schema_version"]["const"] == (
              "rankweave.artifact-verification.v1"
          )

          for file_name, expected_count in (
              ("pairwise-verification.json", 3),
              ("family-verification.json", 4),
          ):
              payload = json.loads(Path(file_name).read_text(encoding="utf-8"))
              assert payload["schema_version"] == (
                  "rankweave.artifact-verification.v1"
              )
              assert payload["rankweave_version"] == "0.14.0"
              assert payload["verified"] is True
              assert payload["artifact_count"] == expected_count
              assert payload["mismatch_count"] == 0

          mismatch = json.loads(Path("mismatch.json").read_text(encoding="utf-8"))
          assert mismatch["verified"] is False
          assert mismatch["mismatch_count"] == 1
          PY
          )
      - run: uv pip check --python .package-smoke/bin/python
