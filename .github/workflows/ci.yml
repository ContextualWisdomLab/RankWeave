name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a32675040c1d81818171ca7d0f3653254e # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a32675040c1d81818171ca7d0f3653254e # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel_path = next(Path("dist").glob("rankweave-*.whl"))
          with ZipFile(wheel_path) as wheel_file:
              wheel_members = set(wheel_file.namelist())
          required_members = {
              "rankweave/__init__.py",
              "rankweave/evaluation.py",
              "rankweave/trec.py",
              "rankweave/tuning.py",
              "rankweave/py.typed",
          }
          missing_members = required_members - wheel_members
          if missing_members:
              raise SystemExit(f"wheel is missing: {sorted(missing_members)!r}")
          PY
      - run: python -m venv .package-smoke
      - run: >-
          .package-smoke/bin/python -m pip install
          --no-index --find-links dist rankweave
      - name: Smoke-test installed wheel
        run: |
          .package-smoke/bin/python - <<'PY'
          from importlib.metadata import version

          import rankweave

          assert version("rankweave") == rankweave.__version__
          assert rankweave.reciprocal_rank_fuse({"dense": ["document"]})
          metrics = rankweave.evaluate_ranking(
              ["document"], {"document": 1}, cutoff=1
          )
          assert metrics.ndcg_at_k == 1.0
          tuning = rankweave.tune_weighted_reciprocal_rank_fusion(
              {"query": {"dense": ["document"]}},
              {"query": {"document": 1}},
              {"dense-only": {"dense": 1.0}},
              cutoff=1,
          )
          assert tuning.best_policy_id == "dense-only"
          trec_report = rankweave.evaluate_trec_run(
              "q Q0 document 1 1.0 rw1\n",
              "q 0 document 1\n",
              cutoff=1,
          )
          assert trec_report.aggregate.mean_ndcg_at_k == 1.0
          PY
      - run: .package-smoke/bin/python -m pip check
