name: Apply convex tuning release updates

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-30-convex-release
  cancel-in-progress: true

jobs:
  apply-verify-push:
    if: >-
      github.event.pull_request.number == 30 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/tune-convex-score-fusion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/tune-convex-score-fusion
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending updater
        id: gate
        run: |
          if [ -f .github/scripts/apply_convex_tuning_release.py ]; then
            echo "apply=true" >>"$GITHUB_OUTPUT"
          else
            echo "apply=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - if: steps.gate.outputs.apply == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply and verify the reviewed release
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python .github/scripts/apply_convex_tuning_release.py
          python - <<'PY'
          from pathlib import Path

          path = Path("uv.lock")
          content = path.read_text(encoding="utf-8")
          old = 'name = "rankweave"\nversion = "0.14.0"'
          new = 'name = "rankweave"\nversion = "0.15.0"'
          if content.count(old) != 1:
              raise SystemExit("uv.lock local rankweave version is not unique")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/scripts/apply_convex_tuning_release.py
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified release updates
        if: steps.gate.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md README.md \
            docs/convex-fusion-tuning.md docs/releasing.md \
            docs/research/README.md \
            docs/superpowers/plans/2026-08-05-convex-score-tuning.md \
            docs/superpowers/specs/2026-08-05-convex-score-tuning-design.md \
            pyproject.toml src/rankweave/__init__.py \
            tests/test_convex_tuning.py tests/test_verification_schema.py \
            tests/test_verify_artifacts_cli.py tests/test_version.py \
            uv.lock
          git add -u .github/scripts/apply_convex_tuning_release.py
          git -c core.hooksPath=/dev/null commit \
            -m "release: prepare RankWeave 0.15.0"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/tune-convex-score-fusion"
