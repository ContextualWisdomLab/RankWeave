name: Publish RankWeave

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Verify released commit, tag, and package metadata
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release_tag) is None:
              raise SystemExit(
                  f"release tag is not canonical: {release_tag!r}"
              )
          if os.environ["RELEASE_PRERELEASE"].lower() != "false":
              raise SystemExit("stable package publication rejects prereleases")

          checked_out_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          release_sha = os.environ["RELEASE_SHA"]
          if checked_out_sha != release_sha:
              raise SystemExit(
                  f"checked-out commit {checked_out_sha!r} does not match "
                  f"release event commit {release_sha!r}"
              )

          default_branch_ref = (
              "origin/" + os.environ["DEFAULT_BRANCH"]
          )
          ancestry = subprocess.run(
              [
                  "git",
                  "merge-base",
                  "--is-ancestor",
                  checked_out_sha,
                  default_branch_ref,
              ],
              check=False,
          )
          if ancestry.returncode != 0:
              raise SystemExit(
                  "released commit must be reachable from the default branch"
              )

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          version = project["project"]["version"]
          if release_tag != f"v{version}":
              raise SystemExit(
                  f"release tag {release_tag!r} does not match "
                  f"project version {version!r}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output_file:
              output_file.write(f"version={version}\n")
          PY
      - run: uv sync --frozen --extra dev --python 3.13
      - name: Verify public version identity
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          import os

          import rankweave

          package_version = os.environ["PACKAGE_VERSION"]
          if rankweave.__version__ != package_version:
              raise SystemExit(
                  f"rankweave.__version__ {rankweave.__version__!r} "
                  f"does not match project version {package_version!r}"
              )
          PY
      - run: uv run --frozen --extra dev --python 3.13 python -m compileall -q src
      - run: uv run --frozen --extra dev --python 3.13 python -m ruff check .
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage run -m pytest -q
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage report
      - run: uv build --wheel --sdist --out-dir dist
      - name: Verify release archives
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tarfile
          from zipfile import ZipFile
          import os

          version = os.environ["PACKAGE_VERSION"]
          dist_path = Path("dist")
          wheels = tuple(dist_path.glob("rankweave-*.whl"))
          source_distributions = tuple(
              dist_path.glob("rankweave-*.tar.gz")
          )
          if len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit(
                  "release must contain exactly one wheel and one "
                  "source distribution"
              )

          expected_prefix = f"rankweave-{version}"
          expected_wheel = f"{expected_prefix}-py3-none-any.whl"
          expected_sdist = f"{expected_prefix}.tar.gz"
          if wheels[0].name != expected_wheel:
              raise SystemExit(
                  f"unexpected wheel name: {wheels[0].name!r}"
              )
          if source_distributions[0].name != expected_sdist:
              raise SystemExit(
                  "unexpected source distribution name: "
                  f"{source_distributions[0].name!r}"
              )

          with ZipFile(wheels[0]) as wheel_file:
              wheel_members = set(wheel_file.namelist())
          required_wheel_members = {
              "rankweave/__init__.py",
              "rankweave/__main__.py",
              "rankweave/artifact_verification.py",
              "rankweave/cli.py",
              "rankweave/report_schemas.py",
              "rankweave/schemas/artifact-verification-v1.schema.json",
              "rankweave/schemas/trec-comparison-v1.schema.json",
              "rankweave/schemas/trec-comparison-v2.schema.json",
              "rankweave/schemas/trec-family-comparison-v1.schema.json",
              "rankweave/schemas/trec-family-comparison-v2.schema.json",
              "rankweave/py.typed",
          }
          missing_wheel_members = required_wheel_members - wheel_members
          if missing_wheel_members:
              raise SystemExit(
                  f"wheel is missing: {sorted(missing_wheel_members)!r}"
              )

          with open_tarfile(source_distributions[0], "r:gz") as archive:
              source_members = set(archive.getnames())
          source_root = f"{expected_prefix}/"
          required_source_members = {
              source_root + "pyproject.toml",
              source_root + "README.md",
              source_root + "CHANGELOG.md",
              source_root + "LICENSE",
              source_root + "src/rankweave/__init__.py",
              source_root + "tests/test_version.py",
          }
          missing_source_members = required_source_members - source_members
          if missing_source_members:
              raise SystemExit(
                  "source distribution is missing: "
                  f"{sorted(missing_source_members)!r}"
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-distributions
          path: dist/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  provenance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: dist/
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rankweave
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: dist/
          digest-mismatch: error
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
