name: Publish RankWeave

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable GitHub Release tag
        required: true
        type: string
      release_sha:
        description: Exact released commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.distributions.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Verify released commit, tag, package, and GitHub Release
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_RELEASE_SHA: ${{ inputs.release_sha || '' }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$EVENT_RELEASE_TAG"
            release_sha="$EVENT_SHA"
            release_prerelease="$EVENT_RELEASE_PRERELEASE"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_RELEASE_TAG"
            release_sha="$DISPATCH_RELEASE_SHA"
            release_prerelease="false"
          else
            echo "unsupported publication event: ${EVENT_NAME}" >&2
            exit 1
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag is not canonical: ${release_tag}" >&2
            exit 1
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "released commit SHA is not canonical: ${release_sha}" >&2
            exit 1
          fi
          if [[ "$release_prerelease" != "false" ]]; then
            echo "stable package publication rejects prereleases" >&2
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$release_sha" ]]; then
            echo "checked-out commit ${checked_out_sha} does not match " \
              "released commit ${release_sha}" >&2
            exit 1
          fi
          git fetch --force --tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
            "$checked_out_sha" "origin/$DEFAULT_BRANCH"; then
            echo "released commit must be reachable from the default branch" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          if [[ "$tag_commit" != "$release_sha" ]]; then
            echo "release tag does not resolve to the released commit" >&2
            exit 1
          fi

          version="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          print(project["project"]["version"])
          PY
          )"
          if [[ "$release_tag" != "v${version}" ]]; then
            echo "release tag ${release_tag} does not match project version " \
              "${version}" >&2
            exit 1
          fi

          encoded_tag="$(python - "$release_tag" <<'PY'
          from sys import argv
          from urllib.parse import quote

          print(quote(argv[1], safe=""))
          PY
          )"
          release_status="$(
            curl --silent --show-error --location \
              --output /tmp/rankweave-release.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          )"
          if [[ "$release_status" != "200" ]]; then
            echo "stable GitHub Release is unavailable: ${release_status}" >&2
            exit 1
          fi
          RELEASE_TAG="$release_tag" RELEASE_SHA="$release_sha" python - <<'PY'
          from pathlib import Path
          import json
          import os

          release = json.loads(
              Path("/tmp/rankweave-release.json").read_text(encoding="utf-8")
          )
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("stable GitHub Release tag does not match")
          if release.get("draft") is not False:
              raise SystemExit("stable GitHub Release must not be a draft")
          if release.get("prerelease") is not False:
              raise SystemExit("stable GitHub Release must not be a prerelease")
          PY

          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - run: uv sync --frozen --extra dev --python 3.13
      - name: Verify public version identity
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          import os

          import rankweave

          package_version = os.environ["PACKAGE_VERSION"]
          if rankweave.__version__ != package_version:
              raise SystemExit(
                  f"rankweave.__version__ {rankweave.__version__!r} "
                  f"does not match project version {package_version!r}"
              )
          PY
      - run: uv run --frozen --extra dev --python 3.13 python -m compileall -q src
      - run: uv run --frozen --extra dev --python 3.13 python -m ruff check .
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage run -m pytest -q
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage report
      - run: uv build --wheel --sdist --out-dir dist
      - name: Verify release archives
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tarfile
          from zipfile import ZipFile
          import os

          version = os.environ["PACKAGE_VERSION"]
          dist_path = Path("dist")
          wheels = tuple(dist_path.glob("rankweave-*.whl"))
          source_distributions = tuple(
              dist_path.glob("rankweave-*.tar.gz")
          )
          if len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit(
                  "release must contain exactly one wheel and one "
                  "source distribution"
              )

          expected_prefix = f"rankweave-{version}"
          expected_sdist = f"{expected_prefix}.tar.gz"
          if not (
              wheels[0].name.startswith(f"{expected_prefix}-cp310-abi3-")
              and wheels[0].suffix == ".whl"
          ):
              raise SystemExit(
                  f"unexpected stable-ABI wheel name: {wheels[0].name!r}"
              )
          if source_distributions[0].name != expected_sdist:
              raise SystemExit(
                  "unexpected source distribution name: "
                  f"{source_distributions[0].name!r}"
              )

          with ZipFile(wheels[0]) as wheel_file:
              wheel_members = set(wheel_file.namelist())
          required_wheel_members = {
              "rankweave/__init__.py",
              "rankweave/__main__.py",
              "rankweave/artifact_verification.py",
              "rankweave/cli.py",
              "rankweave/cross_validation.py",
              "rankweave/report_schemas.py",
              "rankweave/schemas/artifact-verification-v1.schema.json",
              "rankweave/schemas/trec-comparison-v1.schema.json",
              "rankweave/schemas/trec-comparison-v2.schema.json",
              "rankweave/schemas/trec-family-comparison-v1.schema.json",
              "rankweave/schemas/trec-family-comparison-v2.schema.json",
              "rankweave/temporal_backtesting.py",
              "rankweave/py.typed",
          }
          missing_wheel_members = required_wheel_members - wheel_members
          if missing_wheel_members:
              raise SystemExit(
                  f"wheel is missing: {sorted(missing_wheel_members)!r}"
              )

          with open_tarfile(source_distributions[0], "r:gz") as archive:
              source_members = set(archive.getnames())
          source_root = f"{expected_prefix}/"
          required_source_members = {
              source_root + "pyproject.toml",
              source_root + "README.md",
              source_root + "CHANGELOG.md",
              source_root + "LICENSE",
              source_root + "src/rankweave/__init__.py",
              source_root + "tests/test_version.py",
          }
          missing_source_members = required_source_members - source_members
          if missing_source_members:
              raise SystemExit(
                  "source distribution is missing: "
                  f"{sorted(missing_source_members)!r}"
              )
          PY
      - name: Record immutable distribution checksums
        id: distributions
        run: |
          set -euo pipefail
          mkdir -p release-handoff
          (
            cd dist
            sha256sum *.whl *.tar.gz
          ) > release-handoff/SHA256SUMS
          manifest_sha256="$(
            sha256sum release-handoff/SHA256SUMS | cut -d ' ' -f1
          )"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-distributions
          path: |
            dist/
            release-handoff/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  provenance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: handoff/
      - name: Verify immutable distribution handoff
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$EXPECTED_MANIFEST_SHA256" \
            handoff/release-handoff/SHA256SUMS | \
            sha256sum --check --strict -
          (
            cd handoff/dist
            sha256sum --check --strict ../release-handoff/SHA256SUMS
          )
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            handoff/dist/*.whl
            handoff/dist/*.tar.gz

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rankweave
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: handoff/
      - name: Verify immutable distribution handoff
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$EXPECTED_MANIFEST_SHA256" \
            handoff/release-handoff/SHA256SUMS | \
            sha256sum --check --strict -
          (
            cd handoff/dist
            sha256sum --check --strict ../release-handoff/SHA256SUMS
          )
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: handoff/dist/
