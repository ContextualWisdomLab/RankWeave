name: Publish RankWeave

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable GitHub Release tag
        required: true
        type: string
      release_sha:
        description: Exact released commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.version.outputs.release_sha }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Verify released commit, tag, package, and GitHub Release
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_RELEASE_SHA: ${{ inputs.release_sha || '' }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$EVENT_RELEASE_TAG"
            release_sha="$EVENT_SHA"
            release_prerelease="$EVENT_RELEASE_PRERELEASE"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_RELEASE_TAG"
            release_sha="$DISPATCH_RELEASE_SHA"
            release_prerelease="false"
          else
            echo "unsupported publication event: ${EVENT_NAME}" >&2
            exit 1
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag is not canonical: ${release_tag}" >&2
            exit 1
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "released commit SHA is not canonical: ${release_sha}" >&2
            exit 1
          fi
          if [[ "$release_prerelease" != "false" ]]; then
            echo "stable package publication rejects prereleases" >&2
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$release_sha" ]]; then
            echo "checked-out commit ${checked_out_sha} does not match " \
              "released commit ${release_sha}" >&2
            exit 1
          fi
          git fetch --force --tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
            "$checked_out_sha" "origin/$DEFAULT_BRANCH"; then
            echo "released commit must be reachable from the default branch" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          if [[ "$tag_commit" != "$release_sha" ]]; then
            echo "release tag does not resolve to the released commit" >&2
            exit 1
          fi

          version="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          print(project["project"]["version"])
          PY
          )"
          if [[ "$release_tag" != "v${version}" ]]; then
            echo "release tag ${release_tag} does not match project version " \
              "${version}" >&2
            exit 1
          fi

          encoded_tag="$(python - "$release_tag" <<'PY'
          from sys import argv
          from urllib.parse import quote

          print(quote(argv[1], safe=""))
          PY
          )"
          release_status="$(
            curl --silent --show-error --location \
              --output /tmp/rankweave-release.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          )"
          if [[ "$release_status" != "200" ]]; then
            echo "stable GitHub Release is unavailable: ${release_status}" >&2
            exit 1
          fi
          RELEASE_TAG="$release_tag" RELEASE_SHA="$release_sha" python - <<'PY'
          from pathlib import Path
          import json
          import os

          release = json.loads(
              Path("/tmp/rankweave-release.json").read_text(encoding="utf-8")
          )
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("stable GitHub Release tag does not match")
          if release.get("draft") is not False:
              raise SystemExit("stable GitHub Release must not be a draft")
          if release.get("prerelease") is not False:
              raise SystemExit("stable GitHub Release must not be a prerelease")
          PY

          {
            printf 'release_sha=%s\n' "$release_sha"
            printf 'version=%s\n' "$version"
          } >>"$GITHUB_OUTPUT"
      - run: uv sync --frozen --extra dev --python 3.13
      - name: Verify public version identity
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --frozen --extra dev --python 3.13 python - <<'PY'
          import os

          import rankweave

          package_version = os.environ["PACKAGE_VERSION"]
          if rankweave.__version__ != package_version:
              raise SystemExit(
                  f"rankweave.__version__ {rankweave.__version__!r} "
                  f"does not match project version {package_version!r}"
              )
          PY
      - run: uv run --frozen --extra dev --python 3.13 python -m compileall -q src
      - run: uv run --frozen --extra dev --python 3.13 python -m ruff check .
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage run -m pytest -q
      - run: uv run --frozen --extra dev --python 3.13 python -m coverage report
      - run: uv build --sdist --out-dir dist
      - name: Verify source distribution
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv run --frozen --extra dev --python 3.13 python
          scripts/verify_release_archives.py --dist-dir dist
          --version "$PACKAGE_VERSION" --require-sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-build-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux
            compatibility: manylinux2014
            wheel_tag: manylinux
          - runner: macos-14
            artifact: macos
            compatibility: ""
            wheel_tag: macosx
          - runner: windows-latest
            artifact: windows
            compatibility: ""
            wheel_tag: win_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Build native wheel
        shell: bash
        env:
          COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          build_args=(--release --locked --out dist --interpreter python)
          if [[ -n "$COMPATIBILITY" ]]; then
            build_args+=(--compatibility "$COMPATIBILITY")
          fi
          uvx --from maturin==1.14.1 maturin build "${build_args[@]}"
      - name: Verify native wheel
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.release_version }}
          WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: >-
          python scripts/verify_release_archives.py --dist-dir dist
          --version "$PACKAGE_VERSION" --wheel-tag "$WHEEL_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-build-wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  assemble:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.distributions.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rankweave-build-*
          path: dist/
          merge-multiple: true
      - name: Verify complete cross-platform release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.release_version }}
        run: >-
          python scripts/verify_release_archives.py --dist-dir dist
          --version "$PACKAGE_VERSION" --wheel-tag manylinux --wheel-tag macosx
          --wheel-tag win_amd64 --require-sdist
      - name: Record immutable distribution checksums
        id: distributions
        run: |
          set -euo pipefail
          mkdir -p release-handoff
          (
            cd dist
            sha256sum ./*.whl ./*.tar.gz
          ) > release-handoff/SHA256SUMS
          manifest_sha256="$(
            sha256sum release-handoff/SHA256SUMS | cut -d ' ' -f1
          )"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankweave-distributions
          path: |
            dist/
            release-handoff/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  provenance:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: handoff/
      - name: Verify immutable distribution handoff
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$EXPECTED_MANIFEST_SHA256" \
            handoff/release-handoff/SHA256SUMS | \
            sha256sum --check --strict -
          (
            cd handoff/dist
            sha256sum --check --strict ../release-handoff/SHA256SUMS
          )
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            handoff/dist/*.whl
            handoff/dist/*.tar.gz

  publish:
    needs: [assemble, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rankweave
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rankweave-distributions
          path: handoff/
      - name: Verify immutable distribution handoff
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$EXPECTED_MANIFEST_SHA256" \
            handoff/release-handoff/SHA256SUMS | \
            sha256sum --check --strict -
          (
            cd handoff/dist
            sha256sum --check --strict ../release-handoff/SHA256SUMS
          )
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: handoff/dist/
