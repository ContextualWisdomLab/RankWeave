name: Apply trusted release documentation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-pr-28-release-docs
  cancel-in-progress: true

jobs:
  apply-verify-push:
    if: >-
      github.event.pull_request.number == 28 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/trusted-pypi-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/trusted-pypi-release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply documentation and planning changes
        run: |
          set -euo pipefail
          python .github/scripts/apply_release_docs.py
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check --fix \
            .github/scripts/apply_release_docs.py \
            tests/test_publish_workflow.py
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
      - name: Commit verified documentation and remove the updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/scripts/apply_release_docs.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md README.md \
            docs tests/test_publish_workflow.py
          git add -u .github/scripts/apply_release_docs.py
          git -c core.hooksPath=/dev/null commit \
            -m "docs: govern trusted RankWeave releases"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci/trusted-pypi-release"
