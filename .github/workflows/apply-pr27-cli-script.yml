name: Execute PR 27 CLI patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-27-cli-script
  cancel-in-progress: true

jobs:
  patch-test-push:
    if: >-
      github.event.pull_request.number == 27 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/verify-report-artifacts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/verify-report-artifacts
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply and verify the focused CLI implementation
        run: |
          python .github/scripts/apply_pr27_cli.py
          grep -n "verify-artifacts" src/rankweave/cli.py
          PYTHONPATH="$PWD/src" python - <<'PY'
          from rankweave.cli import build_parser

          choices = build_parser()._subparsers._group_actions[0].choices
          assert "verify-artifacts" in choices
          PY
          uv lock
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check --fix \
            src/rankweave/cli.py src/rankweave/__init__.py \
            tests/test_verify_artifacts_cli.py
          PYTHONPATH="$PWD/src" uv run --frozen --extra dev --python 3.13 \
            python -m pytest -q \
            tests/test_artifact_verification.py \
            tests/test_artifact_verification_defensive.py \
            tests/test_verify_artifacts_cli.py
      - name: Commit and push the verified focused implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/rankweave/cli.py src/rankweave/__init__.py \
            pyproject.toml tests/test_version.py \
            tests/test_verify_artifacts_cli.py uv.lock
          git -c core.hooksPath=/dev/null commit \
            -m "feat: expose exact artifact verification through the CLI"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/verify-report-artifacts"
