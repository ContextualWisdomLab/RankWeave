name: Finalize cross-validation workflow contracts

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-31-cross-validation-finalize
  cancel-in-progress: true

jobs:
  finalize-verify-push:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/cross-validate-convex-fusion'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/cross-validate-convex-fusion
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-validation-workflow-patches
          path: workflow-patches/
          repository: ContextualWisdomLab/RankWeave
          run-id: 30996873246
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Install and verify reviewed workflow patches
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            2c90a3d710e2ae5ac48e36fbad6a95228704a07b66fa182029b4ba9d8d369b01 \
            workflow-patches/ci.yml | sha256sum --check --strict -
          printf '%s  %s\n' \
            4f0492a6e520908424e647a99f7d88134f76a2996ec448dcd0bf04ea9e4d8c8d \
            workflow-patches/publish.yml | sha256sum --check --strict -
          cp workflow-patches/ci.yml .github/workflows/ci.yml
          cp workflow-patches/publish.yml .github/workflows/publish.yml
          rm .github/workflows/apply-cross-validation-release.yml
          rm -rf workflow-patches

          grep -F '"rankweave/cross_validation.py"' \
            .github/workflows/ci.yml
          grep -F '"rankweave/cross_validation.py"' \
            .github/workflows/publish.yml
          grep -F 'assert rankweave.__version__ == "0.16.0"' \
            .github/workflows/ci.yml

          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 \
            python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 \
            python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage report
          uv build --wheel --sdist --out-dir dist
          git diff --check
      - name: Exchange an OpenCode app token for workflow mutation
        id: mutation_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC request environment is unavailable."
            exit 1
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "::error::OIDC token response was empty."
            exit 1
          fi
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "::error::OpenCode GitHub App token response was empty."
            exit 1
          fi
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"
      - name: Commit verified workflow contracts
        env:
          GH_TOKEN: ${{ steps.mutation_token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/publish.yml
          git add -u .github/workflows/apply-cross-validation-release.yml
          git -c core.hooksPath=/dev/null commit \
            -m "ci: verify RankWeave 0.16.0 package contracts"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/cross-validate-convex-fusion"
