name: Finalize PR 27 release contracts

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-finalize-pr-27
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    if: >-
      github.event.pull_request.number == 27 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/verify-report-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/verify-report-artifacts
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Apply deterministic release finalization
        run: python .github/scripts/finalize_pr27.py
      - name: Verify source, tests, coverage, and wheel
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 python -m ruff check .
          uv run --frozen --extra dev --python 3.13 python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 python -m coverage report
          uv build --wheel --out-dir dist
      - name: Commit verified release finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md README.md \
            docs src tests
          git -c core.hooksPath=/dev/null commit \
            -m "feat: finalize exact artifact verification contracts"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/verify-report-artifacts"
