name: Fix PR 27 patch script escaping

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  fix-and-push:
    if: >-
      github.event.pull_request.number == 27 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/verify-report-artifacts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/verify-report-artifacts
          persist-credentials: false
      - name: Preserve the generated newline escape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_pr27_cli.py")
          text = path.read_text(encoding="utf-8")
          old = '            output_bytes = rendered_output.encode("utf-8") + b"\\n"\n'
          new = '            output_bytes = rendered_output.encode("utf-8") + b"\\\\n"\n'
          if old not in text:
              raise SystemExit("newline escape anchor is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit and push the corrected patch script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/apply_pr27_cli.py
          git -c core.hooksPath=/dev/null commit \
            -m "ci: preserve generated CLI newline escaping"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/verify-report-artifacts"
