name: Lock PR 26 dependencies

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-pr-26-dependency-lock
  cancel-in-progress: true

jobs:
  lock-and-verify:
    if: >-
      github.event.pull_request.number == 26 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/report-json-schemas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/report-json-schemas
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Pin build and development inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'requires = ["hatchling"]': 'requires = ["hatchling==1.31.0"]',
              '"coverage[toml]>=7.6",': '"coverage[toml]==7.15.2",',
              '"jsonschema>=4.23,<5",': '"jsonschema==4.26.0",',
              '"pytest>=8",': '"pytest==9.1.1",',
              '"ruff>=0.6",': '"ruff==0.15.22",',
              '"tomli>=2",': '"tomli==2.4.1",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing dependency anchor: {old}")
              text = text.replace(old, new, 1)
          marker = "\n[tool.hatch.build.targets.wheel]\n"
          if marker not in text:
              raise SystemExit("missing uv configuration anchor")
          text = text.replace(
              marker,
              '\n[tool.uv]\nrequired-version = "==0.11.29"\n\n'
              + marker.lstrip("\n"),
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate and verify the cross-version lock
        run: |
          uv lock --upgrade
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 python -m ruff check .
          uv run --frozen --extra dev --python 3.13 python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 python -m coverage report
          uv build --wheel --out-dir dist

      - name: Commit and push the verified lock inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git -c core.hooksPath=/dev/null commit \
            -m "ci: lock RankWeave development dependencies with uv"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/report-json-schemas"
