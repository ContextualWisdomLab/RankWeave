name: Repair PR 24 post-review hardening

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: rankweave-repair-pr-24
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: >-
      github.event.pull_request.number == 24 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/post-review-hardening-0.11.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/post-review-hardening-0.11.1
          fetch-depth: 0
          persist-credentials: false

      - name: Patch autonomous policy and token preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/hourly-commercialization-loop.yml")
          workflow = path.read_text(encoding="utf-8")


          def replace_once(old: str, new: str, label: str) -> None:
              global workflow
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one fragment, found {count}"
                  )
              workflow = workflow.replace(old, new, 1)


          replace_once(
              '''              "edit": {
                "*": "allow",
                ".github/**": "deny",
''',
              '''              "edit": {
                "*": "allow",
                "AGENTS.md": "deny",
                ".github/**": "deny",
''',
              "implementation agent-control permission",
          )
          replace_once(
              '''          Update CHANGELOG.md, README.md, AGENTS.md, relevant product or operations
''',
              '''          Update CHANGELOG.md, README.md, relevant product or operations
''',
              "implementation documentation prompt",
          )
          replace_once(
              '''          forbidden_exact = {".gitmodules", "CODEOWNERS", "SECURITY.md"}
''',
              '''          forbidden_exact = {
              ".gitmodules",
              "AGENTS.md",
              "CODEOWNERS",
              "SECURITY.md",
          }
''',
              "autonomous protected exact paths",
          )
          replace_once(
              '''          allowed_exact = {
              "AGENTS.md",
              "CHANGELOG.md",
''',
              '''          allowed_exact = {
              "CHANGELOG.md",
''',
              "autonomous exact allowlist",
          )

          token_marker = '''      - name: Exchange an OpenCode app token for generated PR events
        id: generated_pr_token
        if: steps.gate.outputs.eligible == 'true'
'''
          preflight = '''      - name: Recheck queue and base before token exchange
        id: mutation_preflight
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_pr_count="$(
            gh api "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \\
              --jq 'length'
          )"
          if [ "$open_pr_count" -ne 0 ]; then
            echo "Another pull request acquired the queue before token exchange."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current_base_sha="$(
            gh api "/repos/${TARGET_REPOSITORY}/commits/${BASE_BRANCH}" \\
              --jq '.sha'
          )"
          if [ "$current_base_sha" != "$AUTOMATION_BASE_SHA" ]; then
            echo "The base branch moved before token exchange."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Exchange an OpenCode app token for generated PR events
        id: generated_pr_token
        if: steps.mutation_preflight.outputs.eligible == 'true'
'''
          replace_once(token_marker, preflight, "generated PR token preflight")
          replace_once(
              '''      - name: Open exactly one focused pull request
        if: steps.gate.outputs.eligible == 'true'
''',
              '''      - name: Open exactly one focused pull request
        if: steps.mutation_preflight.outputs.eligible == 'true'
''',
              "generated PR mutation condition",
          )

          path.write_text(workflow, encoding="utf-8")
          Path(".github/workflows/patch-post-review-hardening.yml").unlink(
              missing_ok=True
          )
          PY

      - name: Verify the patched branch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Commit and push the verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: protect agent controls before token exchange"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/fix/post-review-hardening-0.11.1"
