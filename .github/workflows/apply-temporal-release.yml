name: Apply temporal backtesting release metadata

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: rankweave-pr-32-temporal-release
  cancel-in-progress: true

jobs:
  apply-verify-push:
    if: >-
      github.event.pull_request.number == 32 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/temporal-convex-backtesting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/temporal-convex-backtesting
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Synchronize non-workflow release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_all(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding="utf-8")
              if old in content:
                  path.write_text(content.replace(old, new), encoding="utf-8")

          for path_text in (
              "uv.lock",
              "README.md",
              "docs/releasing.md",
              "tests/test_verify_artifacts_cli.py",
          ):
              replace_all(path_text, "0.16.0", "0.17.0")
          PY
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev --python 3.13 python -m compileall -q src
          uv run --frozen --extra dev --python 3.13 python -m ruff check .
          uv run --frozen --extra dev --python 3.13 \
            python -m coverage run -m pytest -q
          uv run --frozen --extra dev --python 3.13 python -m coverage report
          uv build --wheel --sdist --out-dir dist
      - name: Commit verified metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist .coverage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock README.md docs/releasing.md \
            tests/test_verify_artifacts_cli.py
          git -c core.hooksPath=/dev/null commit \
            -m "release: synchronize RankWeave 0.17.0 metadata"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feat/temporal-convex-backtesting"
