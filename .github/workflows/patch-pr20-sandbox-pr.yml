name: Trigger PR 20 sandbox repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: trigger-pr20-sandbox-repair
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.head_ref == 'nim/hourly-commercialization-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nim/hourly-commercialization-loop
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and execute the reviewed patch block
        run: |
          set -euo pipefail
          cp tests/test_hourly_commercialization_workflow.py \
            /tmp/original-hourly-workflow-tests.py
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/patch-pr20-sandbox.yml').read_text(
              encoding='utf-8'
          )
          start = (
              '      - name: Apply sandbox hardening and remove this workflow\n'
              '        run: |\n'
          )
          end = '\n      - name: Verify the repaired branch\n'
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('one-shot patch workflow shape drifted')
          block = source.split(start, 1)[1].split(end, 1)[0]
          lines = [
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ]
          Path('/tmp/apply-pr20-sandbox-patch.sh').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-pr20-sandbox-patch.sh
          python - <<'PY'
          from pathlib import Path

          destination = Path('tests/test_hourly_commercialization_workflow.py')
          original = Path('/tmp/original-hourly-workflow-tests.py').read_text(
              encoding='utf-8'
          ).rstrip()
          mutated = destination.read_text(encoding='utf-8')
          marker = '\ndef test_untrusted_execution_uses_disposable_unprivileged_trees():'
          if mutated.count(marker) != 1:
              raise SystemExit('sandbox contract test marker was not added exactly once')
          addition = mutated[mutated.index(marker):].rstrip()
          destination.write_text(original + '\n\n' + addition + '\n', encoding='utf-8')

          workflow_path = Path('.github/workflows/hourly-commercialization-loop.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_clean = '''          rm -f opencode.json .agent-red-output.txt
          git clean -fdX
'''
          new_clean = '''          pr_message_backup="${RUNNER_TEMP}/agent-pr-message.md"
          if [ -f PR_MESSAGE.md ]; then
            cp PR_MESSAGE.md "$pr_message_backup"
          fi
          rm -f opencode.json .agent-red-output.txt
          git clean -fdX
          if [ -f "$pr_message_backup" ]; then
            cp "$pr_message_backup" PR_MESSAGE.md
          fi
'''
          if workflow.count(old_clean) != 1:
              raise SystemExit('final ignored-file cleanup shape drifted')
          workflow = workflow.replace(old_clean, new_clean, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          helper_path = Path('.github/scripts/materialize_workspace.py')
          helper = helper_path.read_text(encoding='utf-8')
          old_mode = '            os.chmod(target, stat.S_IMODE(info.st_mode))\n'
          new_mode = (
              '            safe_mode = 0o755 if info.st_mode & stat.S_IXUSR else 0o644\n'
              '            os.chmod(target, safe_mode)\n'
          )
          if helper.count(old_mode) != 1:
              raise SystemExit('workspace mode-copy shape drifted')
          helper_path.write_text(helper.replace(old_mode, new_mode, 1), encoding='utf-8')

          contract_marker = '    assert \'strict UTF-8\' in workflow\n'
          contract_addition = (
              contract_marker
              + '    assert \'pr_message_backup="${RUNNER_TEMP}/agent-pr-message.md"\' in workflow\n'
              + '    assert \'safe_mode = 0o755 if info.st_mode & stat.S_IXUSR else 0o644\' in '
              + "Path('.github/scripts/materialize_workspace.py').read_text(encoding='utf-8')\n"
          )
          contracts = destination.read_text(encoding='utf-8')
          if contracts.count(contract_marker) != 1:
              raise SystemExit('sandbox contract insertion point drifted')
          destination.write_text(
              contracts.replace(contract_marker, contract_addition, 1),
              encoding='utf-8',
          )
          PY
          rm -f .github/workflows/patch-pr20-sandbox-pr.yml

      - name: Verify the repaired branch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report
          python .github/scripts/materialize_workspace.py --help >/dev/null

      - name: Commit and push the verified repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: isolate autonomous tests from trusted credentials"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/nim/hourly-commercialization-loop"
