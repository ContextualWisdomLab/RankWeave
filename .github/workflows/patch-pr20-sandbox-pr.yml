name: Trigger PR 20 sandbox repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: trigger-pr20-sandbox-repair
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.head_ref == 'nim/hourly-commercialization-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nim/hourly-commercialization-loop
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and execute the reviewed patch block
        run: |
          set -euo pipefail
          cp tests/test_hourly_commercialization_workflow.py \
            /tmp/original-hourly-workflow-tests.py
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/patch-pr20-sandbox.yml').read_text(
              encoding='utf-8'
          )
          start = (
              '      - name: Apply sandbox hardening and remove this workflow\n'
              '        run: |\n'
          )
          end = '\n      - name: Verify the repaired branch\n'
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('one-shot patch workflow shape drifted')
          block = source.split(start, 1)[1].split(end, 1)[0]
          lines = [
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ]
          Path('/tmp/apply-pr20-sandbox-patch.sh').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-pr20-sandbox-patch.sh
          python - <<'PY'
          from pathlib import Path

          destination = Path('tests/test_hourly_commercialization_workflow.py')
          original = Path('/tmp/original-hourly-workflow-tests.py').read_text(
              encoding='utf-8'
          ).rstrip()
          mutated = destination.read_text(encoding='utf-8')
          marker = '\ndef test_untrusted_execution_uses_disposable_unprivileged_trees():'
          if mutated.count(marker) != 1:
              raise SystemExit('sandbox contract test marker was not added exactly once')
          addition = mutated[mutated.index(marker):].rstrip()
          destination.write_text(original + '\n\n' + addition + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/patch-pr20-sandbox-pr.yml

      - name: Verify the repaired branch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report
          python .github/scripts/materialize_workspace.py --help >/dev/null

      - name: Commit and push the verified repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: isolate autonomous tests from trusted credentials"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/nim/hourly-commercialization-loop"
