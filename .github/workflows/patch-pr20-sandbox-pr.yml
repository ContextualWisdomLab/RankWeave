name: Trigger PR 20 sandbox repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: trigger-pr20-sandbox-repair
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.head_ref == 'nim/hourly-commercialization-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nim/hourly-commercialization-loop
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the reviewed unprivileged sandbox repair
        run: |
          set -euo pipefail
          python - <<'PATCH'
          from pathlib import Path

          path = Path('.github/scripts/apply_pr20_sandbox_patch.py')
          source = path.read_text(encoding='utf-8')
          old = '''        '          sudo chown -R "$SANDBOX_UID:$SANDBOX_GID"',
                  '            "$validation_dist" "$validation_home" "$ruff_cache"',
          '''
          new = '''        '          sudo chown -R "$SANDBOX_UID:$SANDBOX_GID" "$validation_dist" "$validation_home" "$ruff_cache"',
          '''
          if source.count(old) != 1:
              raise SystemExit('validation ownership command shape drifted')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PATCH
          python .github/scripts/apply_pr20_sandbox_patch.py

      - name: Verify the repaired branch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Commit and push the verified repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit \
            -m "security: run autonomous validation without privileges"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/nim/hourly-commercialization-loop"
