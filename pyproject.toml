[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankweave"
version = "0.4.0"
description = "Language-agnostic hybrid-retrieval score fusion, ranking evaluation, and Unicode query normalization — pure-Python, store-agnostic."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Contextual Wisdom Lab" }]
keywords = [
    "information-retrieval",
    "hybrid-search",
    "rank-fusion",
    "reciprocal-rank-fusion",
    "rrf",
    "retrieval-evaluation",
    "ndcg",
    "dense-retrieval",
    "lexical-retrieval",
    "pgvector",
    "pg_trgm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/rankweave"
Source = "https://github.com/ContextualWisdomLab/rankweave"
Issues = "https://github.com/ContextualWisdomLab/rankweave/issues"

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6", "pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/rankweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rankweave"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
