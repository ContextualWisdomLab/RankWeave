[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankweave"
version = "0.13.0"
description = "Dependency-free retrieval fusion, evaluation, family-wise statistical comparison, policy tuning, TREC benchmarking, and auditable CLI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Contextual Wisdom Lab" }]
keywords = [
    "information-retrieval",
    "hybrid-search",
    "rank-fusion",
    "reciprocal-rank-fusion",
    "rrf",
    "retrieval-evaluation",
    "retrieval-tuning",
    "statistical-significance",
    "randomization-test",
    "multiple-comparisons",
    "holm-correction",
    "family-wise-error-rate",
    "trec",
    "trec-eval",
    "benchmark-comparison",
    "command-line-interface",
    "interoperability",
    "json-schema",
    "ndcg",
    "dense-retrieval",
    "lexical-retrieval",
    "pgvector",
    "pg_trgm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
rankweave = "rankweave.cli:main"

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/rankweave"
Source = "https://github.com/ContextualWisdomLab/rankweave"
Issues = "https://github.com/ContextualWisdomLab/rankweave/issues"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "jsonschema>=4.23,<5",
    "pytest>=8",
    "ruff>=0.6",
    "tomli>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rankweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rankweave"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
