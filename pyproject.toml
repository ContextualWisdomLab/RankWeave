[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "rankweave"
version = "0.19.0"
description = "Rust-backed retrieval fusion, evaluation, family-wise statistical comparison, policy tuning, TREC benchmarking, and auditable CLI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Contextual Wisdom Lab" }]
keywords = [
    "information-retrieval",
    "hybrid-search",
    "rank-fusion",
    "reciprocal-rank-fusion",
    "rrf",
    "retrieval-evaluation",
    "retrieval-tuning",
    "statistical-significance",
    "randomization-test",
    "multiple-comparisons",
    "holm-correction",
    "family-wise-error-rate",
    "trec",
    "trec-eval",
    "benchmark-comparison",
    "command-line-interface",
    "interoperability",
    "json-schema",
    "ndcg",
    "dense-retrieval",
    "lexical-retrieval",
    "pgvector",
    "pg_trgm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
rankweave = "rankweave.cli:main"

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/rankweave"
Source = "https://github.com/ContextualWisdomLab/rankweave"
Issues = "https://github.com/ContextualWisdomLab/rankweave/issues"

[project.optional-dependencies]
dev = [
    "coverage[toml]==7.15.2",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "tomli==2.4.1",
]

[tool.uv]
required-version = "==0.12.1"

[tool.maturin]
manifest-path = "crates/rankweave-python/Cargo.toml"
module-name = "rankweave._rankweave_core"
python-source = "src"
include = ["CHANGELOG.md", "tests/test_version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rankweave"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
